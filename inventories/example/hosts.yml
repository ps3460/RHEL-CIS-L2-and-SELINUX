---
all:
  children:
    rhel9_cis_targets:
      vars:
        ansible_remote_tmp: /tmp/.ansible/tmp
      hosts:
        rhel9-example:
          ansible_host: 192.0.2.10
          ansible_user: ansible
          ansible_become: true
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
          rhel9_cis_l2_ansible_sudo_nopasswd: false
          rhel9_cis_l2_ssh_allow_users:
            - ansible
